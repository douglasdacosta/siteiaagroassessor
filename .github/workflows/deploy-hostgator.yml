name: Deploy na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir pasta no servidor
        id: dir
        env:
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          d="${DIR:-public_html/}"
          d="${d#/}"
          case "$d" in */) ;; *) d="$d/" ;; esac
          echo "path=$d" >> "$GITHUB_OUTPUT"
          echo "Pasta de destino: $d"

      - name: Enviar arquivos por FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          DEST: ${{ steps.dir.outputs.path }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<LFTP
          set ftp:ssl-allow true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate false
          set net:max-retries 2
          set net:timeout 30
          mirror --reverse --verbose --only-newer --no-perms \
            --exclude-glob .git* --exclude .github/ --exclude-glob README.md \
            ./ "$DEST"
          bye
          LFTP
