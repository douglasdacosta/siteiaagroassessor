name: Deploy na HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir pasta no servidor
        id: dir
        env:
          DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          d="${DIR:-public_html/}"
          d="${d#/}"
          case "$d" in */) ;; *) d="$d/" ;; esac
          echo "path=$d" >> "$GITHUB_OUTPUT"
          echo "Pasta de destino: $d"

      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ steps.dir.outputs.path }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
